name: Build and Push Docker Image to ACR

on:
  push:
    branches: [master]

env:
  ACR_URL: crpi-rzchxytwau72r5tq.cn-beijing.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ocr_anoetos
  IMAGE_NAME: ocr1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_URL }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.ACR_URL }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
